[package]
name = "shikumi"
version = "0.1.531"
edition = "2024"
rust-version = "1.89.0"
description = "Shikumi (仕組み) — config discovery, hot-reload, and ArcSwap store for Nix-managed desktop apps"
homepage = "https://github.com/pleme-io/shikumi"
repository = "https://github.com/pleme-io/shikumi"
documentation = "https://docs.rs/shikumi"
readme = "README.md"
license = "MIT"
categories = ["config"]
keywords = ["config", "hot-reload", "nix", "figment", "arcswap"]

[lints.clippy]
pedantic = "warn"

# The `hotswap` feature was removed from `[features]` above because
# `pleme-hotswap` is not on crates.io (the auto-release pre-check rejects
# optional git deps). The seven `#[cfg(feature = "hotswap")]` gates covering
# the surface it wraps — one re-export in `src/lib.rs`, five gates and one
# `#[cfg(all(test, feature = "hotswap"))]` test module in `src/store.rs` —
# stay in-tree so re-adding the feature is a one-line change once
# `pleme-hotswap` publishes. Without this `check-cfg` entry, every one of
# those gates emits `unexpected_cfg_condition_value` at `cargo build`
# (measured 2026-08-05: 7 warnings on `cargo build --all-features`), and a
# future misspelled `#[cfg(feature = "hotwsap")]` typo would blend into that
# same warning cluster instead of surfacing on its own. Declaring `hotswap`
# as a KNOWN feature value lets the gates evaluate false silently while any
# other misspelled feature name still warns. `src/lib.rs`'s
# `check_cfg_tests` module pins this invariant from the runtime side. Delete
# this entry together with the last surviving `#[cfg(feature = "hotswap")]`
# gate — never before, never after.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("hotswap"))'] }

[features]
default = []

# Per-field hot-swap-safety classification (theory/CALHA.md §6.3).
#
# RESTORED 2026-08-06. This feature was deleted — not stubbed, deleted —
# because `pleme-hotswap` was not on crates.io and the auto-release
# pre-check rejects optional git deps. The seven `#[cfg(feature =
# "hotswap")]` gates were deliberately left in-tree against exactly this
# day, so the integration (ValidatedTieredConfig, the split-blake3
# ConfigWatermark, ConfigSyncProof, `ConfigStore::load_and_watch_hotswap`,
# and its end-to-end test module) has been complete and unreachable the
# whole time. `pleme-hotswap` 0.1.1 published 2026-08-05; the gates now
# evaluate.
#
# Off by default like every other optional surface here: an app that does
# not classify its config fields should not carry the trait crate.
#
# 2026-08-08: the gated surface grew by one block — a `Validate`-bounded
# `impl ConfigStore<T>` carrying `replace_validated` (takes a
# `ValidatedTieredConfig<T>` BY VALUE, so an unvalidated candidate has no
# argument form) and `try_replace` (validates, then installs, leaving the live
# value untouched on refusal). These exist because `ConfigStore::replace` --
# which is NOT gated and is retained -- pushes a value straight into the
# `ArcSwap` past the gate the initial load and every file reload pass through,
# so an RPC push or an MCP `config_set` could install a value the same process
# would refuse to read from disk. store.rs gate-attribute baseline 5 -> 6
# (src/lib.rs `hotswap_gate_site_count_matches_warning_baseline`).
#
# `dep:blake3` is not incidental — it is the feature's other half.
# `ConfigWatermark` is a SPLIT hash: one blake3 over the whole config, one
# over just the restart-required subtree, so a consumer can prove "the live
# process is running these exact hot fields" independently of whether a cold
# field drifted. Without blake3 the module is 7 × E0433. Measured on the
# restore: enabling `dep:pleme-hotswap` alone fails to compile.
hotswap = ["dep:pleme-hotswap", "dep:blake3"]
# tatara-lisp config file support. Off by default to keep the default
# dependency closure minimal — apps that author Lisp configs opt in
# explicitly. Sourced from crates.io (`tatara-lisp` 0.3.3, the canonical
# pleme-io/tatara-lisp workspace); the retired pleme-io/tatara git pin is
# gone.
lisp = ["dep:tatara-lisp"]

# blue (`.b`) config support — the pleme-io language as a configuration citizen.
#
# Implies `lisp`, and that IS the design: blue's surface parses to a
# tatara-lisp `Sexp` (blue-lang-syntax re-exports `tatara_lisp::{Atom, Sexp}`),
# so the Sexp -> figment::Value mapping this crate already ships for `.lisp` is
# reused verbatim. blue is a FRONT-END on the existing provider, never a second
# one — two mappings would be two things to keep in lockstep, which is the
# drift class this crate is careful about.
#
# Off by default for the same reason `lisp` is: an app that authors no blue
# configs should not carry a language front-end in its closure.
blue = ["dep:blue-lang-syntax", "lisp"]

# clap-based `<app> config-show <tier>` subcommand. The Pillar 12 dual
# of TieredConfig: one factory every consumer pulls in to eliminate
# hand-rolled config-show CLIs. Adds a `clap::Args` struct that runs
# `C::resolve_tier(...)` and emits YAML/JSON or diff between tiers.
cli = ["dep:clap"]

# Native HTTP client for Akeyless Vault via the akeyless-api SDK (604
# endpoints, 1334 types, generated from the Akeyless OpenAPI spec).
# Enables `resolve_akeyless_native` alongside the existing CLI-based
# `resolve_akeyless`. See docs/rfcs/0001-native-vault-sdks-via-forge-gen.md
# for the full native-integration story across all 5 vault backends.
akeyless-native = ["dep:akeyless-api", "dep:tokio"]

# Native AWS Secrets Manager via the upstream aws-sdk-secretsmanager
# crate. AWS generates their SDKs from Smithy, not OpenAPI, so we
# consume the official crate rather than regenerating via forge-gen.
# Pulls in the AWS credential chain (IRSA, IMDSv2, profile files) via
# aws-config. See RFC 0001 for the full rationale.
aws-native = ["dep:aws-sdk-secretsmanager", "dep:aws-config", "dep:tokio"]

# Native 1Password Connect client via thin reqwest HTTP. 1Password's
# Connect API is small enough (~8 endpoints for vaults + items) that a
# hand-written client is cheaper than generating a full SDK. See RFC 0001.
op-native = ["dep:reqwest", "dep:tokio"]

# Native HashiCorp Vault client via thin reqwest HTTP, covering KV v2
# (read/list/write/delete/metadata). See RFC 0001.
vault-native = ["dep:reqwest", "dep:tokio"]

# Native GCP Secret Manager client via thin reqwest HTTP. Auth is the
# caller's job: shikumi accepts a pre-obtained OAuth2 access token
# (from `gcloud auth print-access-token`, yup-oauth2, metadata server,
# or IRSA). This keeps the dep tree minimal — ADC handling stays in
# the consumer that already has auth plumbing. See RFC 0001.
gcp-native = ["dep:reqwest", "dep:tokio"]

# Per-field hot-swap-safety classification (theory/CALHA.md SS6.3):
# a T: HotSwapClassifier + Validate wrapper (ValidatedTieredConfig),
# a split blake3 watermark (full vs. restart-required subtree), and
# hotswap feature removed — pleme-hotswap not on crates.io, can't be
# a dep. The code is gated behind #[cfg(feature = "hotswap")] which
# can never be enabled. Re-add when pleme-hotswap is published.

# ConfigPlane DISCOVERED-tier cluster discovery — the `KubeClusterDiscovery`
# DiscoveryLayer (src/kube_discovery.rs) + its kanchi::ClusterEnv seam. Pulls
# in kanchi (the std-only detection leaf that owns the downward-API / service-DNS
# probes + the ClusterEnv trait). NO Kubernetes API client here — the layer is
# fully exercised against kanchi::MockClusterEnv, so shikumi stays
# k8s-client-free with only this feature on. See CONFIGURATION-MANAGEMENT.md §IX.
kube-discovery = ["dep:kanchi"]

# The REAL in-cluster Kubernetes Secret reader (KubeSecretReader) behind the
# kanchi::ClusterEnv seam: a thin reqwest-blocking GET against the Secret API
# (SA bearer token + projected CA cert), base64-decoding the value. This is the
# only arm that pulls an HTTP client, so it is the one that makes shikumi
# "k8s-capable"; default builds and the mock-driven layer tests never touch it.
# Tier-honest: compiled + type-checked, but proven only structurally + by mock
# (no live cluster in CI) — a shadow-first live proof is the M0 gate.
kube = ["kube-discovery", "dep:reqwest", "reqwest/blocking", "dep:base64"]

[dependencies]
arc-swap = "1.8"
figment = { version = "0.10", features = ["env", "yaml", "toml"] }

# Typed-dispatcher catalog integration
# (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = "0.1"
gen-types = "0.1"
# Cargo features activate globally per-target — turning on a notify
# macOS backend feature in [dependencies] adds the apple-only backend
# crate as an unconditional dep for every target, including Linux
# (fsevent-sys fails to compile; kqueue → kqueue-sys fails to compile).
# The only correct seam is target-gating the feature itself: Linux
# gets bare notify (uses inotify, its only Linux backend), macOS opts
# into a real backend via the target-conditional block below.
notify = { version = "8.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Used by shikumi::tiered::ConfigDiff for structural YAML diffing
# in TieredConfig::diff_against's default impl. Must be a non-dev
# dep because tiered.rs is lib code that consumers compile against.
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
# Object-safe async trait — needed for SecretClient in secret_client.rs.
async-trait = "0.1"
# 0.3.3 -> 0.3.21 to MATCH what blue-lang-syntax resolves. The two MUST agree:
# blue parses to `tatara_lisp::Sexp`, and two semver-compatible-LOOKING
# versions are DISTINCT TYPES to rustc (E0308), so a shared AST is not shared
# across a skew. One AST version fleet-wide is the whole point of a shared AST.
tatara-lisp = { version = "0.3.21", optional = true }
# blue — the pleme-io language. Only the SYNTAX crate: shikumi needs
# `parse_program` (source -> Vec<Sexp>) and nothing else. The runtime,
# interpreter, LSP and package manager stay out of the closure, because a
# config file is PARSED AND MAPPED, NEVER EXECUTED. A config format that can
# run arbitrary code is a much larger security surface, and that boundary is a
# decision rather than an accident of what happened to compile.
blue-lang-syntax = { version = "0.0.2", optional = true }
# Feature-gated `hotswap`: the HotSwapClassifier trait + HotSwapClass/
# SwapDecision runtime types a T: TieredConfig implementor's derived
# impl (via the sibling `pleme-hotswap-derive` proc-macro crate) must
# satisfy. The `pleme-hotswap-derive` repo hosts both crates.
# RE-ADDED 2026-08-06. `pleme-hotswap` published to crates.io as 0.1.1 on
# 2026-08-05, which was the single condition this dep was removed under
# ("Re-add when pleme-hotswap is published to crates.io"). It is a
# crates.io version dep, not a git dep, so the auto-release pre-check that
# rejects optional git deps is satisfied.
pleme-hotswap = { version = "0.1", optional = true }
blake3 = { version = "1", optional = true }
# Feature-gated native Akeyless SDK (generated from OpenAPI via forge-gen).
akeyless-api = { version = "0.1", optional = true }
# Feature-gated native AWS Secrets Manager SDK + credential provider chain.
aws-sdk-secretsmanager = { version = "1", optional = true }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
# Thin HTTP client for `op-native` / `vault-native`. rustls-tls avoids
# pulling openssl into the closure; the features match shikumi's
# deployment story (statically linked Nix binaries).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# Feature-gated for the `cli` feature — clap Args for ConfigShowCommand.
clap = { version = "4", features = ["derive"], optional = true }
# ConfigPlane DISCOVERED tier (`kube-discovery` feature) — the std-only
# detection leaf that owns the cluster-wiring probes + the ClusterEnv seam that
# KubeClusterDiscovery reads through. INTERIM rev-pin to the cluster-discovery
# branch head (the cluster module is not yet on kanchi's main / crates.io);
# repin to `version = "0.1"` once kanchi merges + auto-releases. pending-configplane.
kanchi = { version = "0.1", optional = true }
# base64 decode for the real in-cluster Secret value (`kube` feature only).
base64 = { version = "0.22", optional = true }

# macOS opts into the FSEvents backend for notify. The target-gate is still
# required: Cargo unifies features per-target, so a bare `[dependencies]` line
# would activate the macOS backend chain on every Linux build too. Linux gets
# notify's only Linux backend (inotify) with no macOS dep activated.
#
# ★ It MUST be `macos_fsevent`, never `macos_kqueue` — this line was the latter
# until 2026-07-31 and the difference is not stylistic. In notify 8:
#
#     #[cfg(all(target_os = "macos", not(feature = "macos_kqueue")))]
#     pub type RecommendedWatcher = FsEventWatcher;
#
# `macos_kqueue` is a POISON feature. Cargo features are additive and unify
# across the whole graph, so ONE crate enabling it switches every macOS
# consumer of notify to the kqueue backend — and a consumer cannot un-enable
# it. kqueue holds one open FILE DESCRIPTOR per watched path; FSEvents holds
# none. Measured on cid: the seki prompt daemon, watching one repo recursively,
# held 26,517 open FDs across 3,014 paths (8,967 of them in a cargo
# `target/debug/deps` it had no reason to watch). FSEvents holds zero.
#
# The original rationale was wrong, not merely outdated: it read as though
# `macos_fsevent` would drag `fsevent-sys` into Linux builds. It cannot —
# notify declares fsevent-sys under `[target.'cfg(target_os="macos")']`, so it
# is unreachable off macOS. kqueue was adopted to solve a Linux problem that
# the correct feature never had.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# For SecretSource::{op, sops, akeyless, …} YAML deserialization tests
serde_yaml = "0.9"
# SecretClient async tests — needed even when no native features are on.
tokio = { version = "1", features = ["rt", "macros"] }
# RE-ADDED 2026-08-06 alongside `pleme-hotswap` (both published 0.1.1 on
# 2026-08-05 from the pleme-hotswap-derive repo, which hosts the pair).
# Needed by the `#[cfg(all(test, feature = "hotswap"))]` module in
# src/store.rs, which derives HotSwap on a fixture config to drive the
# end-to-end load_and_watch_hotswap path.
pleme-hotswap-derive = "0.1"
